<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard Geografia Eleitoral</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="css/estilo.css" />
</head>
<body data-tema="escuro">
<div id="map"></div>

<aside id="controles">
  <div id="controles-topo">
    <h1>Dashboard Geografia Eleitoral</h1>
    <button id="btn-tema" type="button" title="Alternar modo claro/escuro">Escuro</button>
  </div>
  <p class="subtitulo" id="subtitulo"></p>

  <button id="btn-swing" type="button" aria-pressed="false" title="Variação do 1º turno de 2022 para 2026, em pontos percentuais">
    Swing Lula × Flávio (1º turno)
  </button>

  <label id="label-ano">
    Eleição
    <select id="sel-ano"></select>
  </label>
  <label id="label-cargo">
    Cargo
    <select id="sel-cargo"></select>
  </label>
  <label>
    UF
    <select id="sel-uf"></select>
  </label>
  <label id="label-turno">
    Turno
    <select id="sel-turno"></select>
  </label>
  <label>
    Unidade de análise
    <select id="sel-unidade"></select>
  </label>
  <div id="swing-controles" class="oculto">
    <span class="rotulo-campo">Candidato</span>
    <div id="swing-candidatos" class="segmentado" role="group" aria-label="Candidato do swing"></div>
  </div>
  <label id="label-modo">
    Modo
    <select id="sel-modo">
      <option value="vencedor">Vencedor</option>
      <option value="isolado">Candidato isolado (contínuo)</option>
      <option value="lisa">Candidato isolado (LISA)</option>
    </select>
  </label>
  <label id="label-candidato">
    Candidato
    <select id="sel-candidato"></select>
  </label>
  <div id="legenda"></div>
  <p id="status"></p>
</aside>

<aside id="painel-direito" hidden>
  <div id="direito-titulo"></div>
  <div id="direito-conteudo"></div>
</aside>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/topojson-client@3/dist/topojson-client.min.js"></script>
<script src="js/dados.js"></script>
<script src="js/cores.js"></script>
<script src="js/mapa.js"></script>
<script src="js/seletores.js"></script>
<script src="js/painel_direito.js"></script>
<script src="js/tema.js"></script>
<script src="js/main.js"></script>
</body>
</html>
